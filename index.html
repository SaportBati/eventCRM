<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arizona Event CRM · Дашборд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="64x64" type="image/png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    if (typeof Chart === 'undefined') {
      document.write('<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>');
    }
  </script>
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>

<body>

  <header>
    <div class="brand"><svg class="brand-mark" viewBox="0 0 30 30" fill="none"><rect x="1.5" y="1.5" width="27" height="27" stroke="currentColor" stroke-width="2"/><path d="M1.5 28.5L28.5 1.5" stroke="currentColor" stroke-width="2"/><circle cx="21" cy="21" r="4.5" fill="#c8381f"/></svg><div class="brand-copy">
        <h1 id="brandTitle">Arizona Event CRM</h1>
        <div class="subtitle" id="brandSub">Журнал отчётов о проведенных МП</div>
      </div>
    </div>

    <div class="nav-tabs-wrap">
      <nav class="nav-tabs">
        <a href="index.html" class="active">Дашборд</a>
        <a href="author.html">Авторы</a>
      </nav>
      <nav class="nav-tabs nav-tabs-secondary">
        <a href="plan.html">Планировщик</a>
        <a href="report.html">Отчёт</a>
      </nav>
    </div>

  </header>

  <main>

    <div id="gateErrorWrap"></div>
    <div class="loading" id="loadingState">
      <div class="spinner"></div>
      Загружаем отчёты…
    </div>

    <div id="app">

      <section id="view-dashboard">

        <div class="bento" id="statsBento"></div>

        <div class="bento">
          <div class="glass panel b-8 js-reveal">
            <div class="panel-title"><span><span class="tick"></span>Отчёты по времени</span></div>
            <div class="chart-wrap"><canvas id="chartTime"></canvas></div>
          </div>
          <div class="glass panel b-4 accent-gold js-reveal">
            <div class="panel-title"><span><span class="tick"></span>По авторам</span></div>
            <div class="chart-wrap"><canvas id="chartAuthors"></canvas></div>
          </div>
          <div class="glass panel b-12 js-reveal">
            <div class="panel-title"><span><span class="tick"></span>Посещаемость — топ участников</span></div>
            <div class="chart-wrap short"><canvas id="chartPlayers"></canvas></div>
          </div>
        </div>

        <div class="table-header js-reveal">
          <h3>Все отчёты</h3>
          <div class="controls">
            <input type="text" id="searchInput" placeholder="Поиск: событие, автор, победитель…">
            <select id="authorFilter">
              <option value="">Все авторы</option>
            </select>
            <select id="sortSelect">
              <option value="new">Сначала новые</option>
              <option value="old">Сначала старые</option>
            </select>
          </div>
        </div>

        <div class="table-scroll js-reveal">
          <table>
            <thead>
              <tr>
                <th>Дата / время</th>
                <th>Событие</th>
                <th>Победитель</th>
                <th>Автор</th>
                <th>Участники</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="empty-state" id="emptyState" style="display:none;">Отчётов не найдено — измени фильтры или дождись
          новых сканов.</div>

        <div class="pagination js-reveal" id="pagination" style="display:none;">
          <button type="button" id="pagePrev" class="page-btn" aria-label="Назад"><svg class="ic" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" ><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
          <span class="page-info" id="pageInfo"></span>
          <button type="button" id="pageNext" class="page-btn" aria-label="Вперёд"><svg class="ic" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" ><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
        </div>
      </section>

    </div>

  </main>
  <div class="lightbox" id="lightbox">
    <div class="lightbox-frame">
      <button class="lightbox-close" id="lightboxClose" aria-label="Закрыть"><svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" ><path d="M3 3l10 10M13 3L3 13"/></svg></button>
      <img id="lightboxImg" src="" alt="Скан крупным планом">
    </div>
  </div>

  <script>
    (async function () {
      const WORKER_URL = "https://bitter-breeze-2c7b.vitadensikloh.workers.dev";
      let allReports = [];
      let charts = {};
      const PAGE_SIZE = 10;
      let currentPage = 1;
      const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const hasGsap = typeof gsap !== 'undefined';

      const $ = (id) => document.getElementById(id);

      // ============== АВТОРИЗАЦИЯ ЧЕРЕЗ ОДНОРАЗОВЫЙ ТОКЕН ==============
      // /esr в игре больше не кладёт голый HWID в URL (он был бы фактически
      // вечным ключом, если кто-то увидит ссылку в истории браузера/логах).
      // Вместо этого воркер выдаёт одноразовый токен, живущий максимум 1
      // минуту (см. /gen-token в worker.js). Мы обмениваем его на HWID через
      // /check-token один раз, а сам HWID уже сохраняем в localStorage —
      // именно поэтому повторные заходы на сайт (без /esr) продолжают
      // работать как раньше, через сохранённый HWID.
      function getTokenFromUrl() {
        const hash = window.location.hash;
        const match = hash.match(/&token=([^&/#]+)/);
        return match ? decodeURIComponent(match[1]) : null;
      }

      function cleanTokenFromUrl() {
        const hash = window.location.hash;
        if (hash.includes('&token=')) {
          const cleanHash = hash.replace(/&token=[^&/#]+/, '');
          window.history.replaceState(null, '', cleanHash || '#/');
        }
      }

      // Одноразовый обмен: токен -> HWID. Токен гасится на сервере при первом
      // же успешном (или неуспешном, но валидном) обращении, поэтому повторно
      // им воспользоваться нельзя, даже если ссылка куда-то "утекла".
      async function exchangeTokenForHwid(token) {
        try {
          const resp = await fetch(WORKER_URL + '/check-token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token })
          });
          if (!resp.ok) return null;
          const data = await resp.json();
          return (data && data.ok && data.hwid) ? data.hwid : null;
        } catch (e) {
          console.error('[Auth] Token exchange failed:', e);
          return null;
        }
      }

      // Спрашиваем сам воркер, есть ли этот HWID в вайтлисте — вместо того,
      // чтобы верить любой строке, которую подсунули в URL/localStorage.
      async function isHwidAllowedByServer(hwid) {
        try {
          const resp = await fetch(WORKER_URL + '/check-hwid', {
            headers: { 'X-HWID': hwid }
          });
          if (!resp.ok) return false;
          const data = await resp.json();
          return Boolean(data && data.ok && data.allowed);
        } catch (e) {
          console.error('[Auth] HWID check request failed:', e);
          return false;
        }
      }

      async function isAuthorized() {
        // Если в URL есть одноразовый токен от /esr — обмениваем его на HWID.
        const tokenFromUrl = getTokenFromUrl();
        if (tokenFromUrl) {
          console.log('[Auth] Login token found in URL');
          const hwid = await exchangeTokenForHwid(tokenFromUrl);

          // ВСЕГДА удаляем токен из URL (даже при неудачном обмене) — он
          // одноразовый и хранить его дальше в адресной строке незачем.
          cleanTokenFromUrl();

          if (!hwid) {
            console.log('[Auth] Token exchange rejected by server');
            localStorage.removeItem('authorized_hwid');
            return false;
          }

          localStorage.setItem('authorized_hwid', hwid);
          console.log('[Auth] HWID obtained via token and saved to localStorage');
          return true;
        }

        // Токена в URL нет — проверяем сохранённый HWID и тоже сверяем с
        // сервером (на случай, если он был отозван из вайтлиста после
        // сохранения). Это и есть тот путь, по которому сайт продолжает
        // работать при обычных повторных заходах, без /esr.
        const savedHwid = localStorage.getItem('authorized_hwid');
        if (savedHwid) {
          const allowed = await isHwidAllowedByServer(savedHwid);
          if (!allowed) {
            localStorage.removeItem('authorized_hwid');
            return false;
          }
          return true;
        }

        return false;
      }

      async function checkAuth() {
        const authorized = await isAuthorized();
        if (!authorized) {
          showAuthRequired();
          return false;
        }
        return true;
      }

      function showAuthRequired() {
        const page = location.pathname.split('/').pop() || 'index.html';
        location.replace('login.html?next=' + encodeURIComponent(page));
      }

      // Проверяем авторизацию при загрузке
      if (!(await checkAuth())) {
        return; // Останавливаем выполнение, если не авторизован
      }
      // ==================================================

      // ---------------- motion helpers ----------------
      function revealStagger(selectorOrEls, opts) {
        if (!hasGsap || reduceMotion) return;
        const els = typeof selectorOrEls === 'string' ? document.querySelectorAll(selectorOrEls) : selectorOrEls;
        if (!els || !els.length) return;
        gsap.fromTo(els, { opacity: 0, y: 22 }, Object.assign({
          opacity: 1, y: 0, duration: .7, ease: 'power3.out', stagger: .06, clearProps: 'transform'
        }, opts || {}));
      }
      function countUp(el, target, opts) {
        if (!el) return;
        const isFloat = opts && opts.decimals;
        if (!hasGsap || reduceMotion) {
          el.textContent = isFloat ? Number(target).toFixed(isFloat) : Math.round(target).toLocaleString('ru-RU');
          return;
        }
        const obj = { v: 0 };
        gsap.to(obj, {
          v: target, duration: 1.3, ease: 'power2.out', delay: (opts && opts.delay) || 0,
          onUpdate() { el.textContent = isFloat ? obj.v.toFixed(isFloat) : Math.round(obj.v).toLocaleString('ru-RU'); }
        });
      }
      function magnetTilt(cardSelector) {
        if (reduceMotion) return;
        document.querySelectorAll(cardSelector).forEach(card => {
          card.addEventListener('mousemove', (e) => {
            const r = card.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            if (hasGsap) {
              gsap.to(card, { rotateX: y * -4, rotateY: x * 4, duration: .4, ease: 'power2.out', transformPerspective: 700 });
            }
          });
          card.addEventListener('mouseleave', () => {
            if (hasGsap) gsap.to(card, { rotateX: 0, rotateY: 0, duration: .5, ease: 'power3.out' });
          });
        });
      }

      // ---------------- status / gate ----------------
      function setStatus(state, text) {
        const dot = $('statusDot'), label = $('statusText');
        if (dot) dot.className = 'dot' + (state === 'live' ? ' live' : state === 'err' ? ' err' : '');
        if (label) label.textContent = text;
      }

      function showError(msg) {
        $('loadingState').style.display = 'none';
        $('app').style.display = 'none';
        $('gateErrorWrap').innerHTML = `<div class="gate-error">${escapeHtml(msg)}</div>`;
      }

      async function connectAndLoad() {
        $('gateErrorWrap').innerHTML = '';
        $('loadingState').style.display = 'block';
        $('app').style.display = 'none';
        setStatus('', 'загрузка…');
        try {
          const res = await fetch(WORKER_URL + '/reports?limit=200');
          if (!res.ok) { throw new Error('Ошибка сервера: HTTP ' + res.status); }
          const data = await res.json();
          if (!data.ok) { throw new Error(data.error || 'Неизвестная ошибка воркера.'); }
          allReports = (data.reports || []).map(parseReport);
          setStatus('live', 'подключено · ' + allReports.length + ' отчётов');
          $('loadingState').style.display = 'none';
          $('app').style.display = 'block';
          buildAuthorFilter();
          renderDashboard();
        } catch (e) {
          setStatus('err', 'ошибка подключения');
          let hint = e.message || String(e);
          if (hint.includes('Failed to fetch')) {
            hint = 'Не удалось достучаться до воркера. Проверь, что он задеплоен и в нём включены CORS-заголовки (см. worker-with-cors.js).';
          }
          showError(hint);
        }
      }

      function parseReport(r) {
        let players = [], scans = [];
        try { players = JSON.parse(r.players || '[]'); } catch (e) { }
        try { scans = JSON.parse(r.scans || '[]'); } catch (e) { }
        if (!Array.isArray(players)) players = [];
        if (!Array.isArray(scans)) scans = [];
        return { ...r, playersArr: players, scansArr: scans };
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function escapeAttr(s) { return escapeHtml(s); }

      // ---------------- date helpers ----------------
      function fmtDate(d) {
        const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }
      function normalizeDateStr(s) {
        if (!s) return '';
        s = String(s).trim();
        let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return `${m[1]}-${String(m[2]).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
        m = s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})/);
        if (m) return `${m[3]}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
        m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
        if (m) return `${m[3]}-${String(m[1]).padStart(2, '0')}-${String(m[2]).padStart(2, '0')}`;
        const d = new Date(s);
        return isNaN(d) ? '' : fmtDate(d);
      }
      function reportDateStr(r) {
        return normalizeDateStr(r.date) || normalizeDateStr(r.created_at) || '';
      }

      // ---------------- aggregation ----------------
      function aggregateByDate(reports) {
        const map = new Map();
        reports.forEach(r => {
          const key = reportDateStr(r);
          if (!key) return;
          map.set(key, (map.get(key) || 0) + 1);
        });
        return [...map.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1);
      }

      function aggregateByAuthor(reports) {
        const map = new Map();
        reports.forEach(r => {
          const a = r.author && r.author.trim() ? r.author.trim() : '—';
          map.set(a, (map.get(a) || 0) + 1);
        });
        return [...map.entries()].sort((a, b) => b[1] - a[1]).slice(0, 10);
      }

      function aggregatePlayers(reports) {
        const map = new Map();
        reports.forEach(r => {
          r.playersArr.forEach(p => {
            const name = (typeof p === 'string') ? p : (p && (p.name || p.player)) || null;
            if (!name) return;
            map.set(name, (map.get(name) || 0) + 1);
          });
        });
        return [...map.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);
      }

      function playerName(p) { return typeof p === 'string' ? p : (p && (p.name || p.player)) || JSON.stringify(p); }

      function renderScanThumb(s) {
        const url = typeof s === 'string' ? s : (s && s.url) || '';
        const time = (s && typeof s === 'object' && s.time) ? s.time : '';
        if (!url) { return `<span class="tag">${escapeHtml(JSON.stringify(s))}</span>`; }
        return `<div class="scan-thumb" data-url="${escapeAttr(url)}" title="Открыть крупнее">
      <img src="${escapeAttr(url)}" alt="Скан" loading="lazy">
      <span class="scan-zoom"><svg class="ic" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" ><path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9"/></svg></span>
      ${time ? `<span class="scan-time">${escapeHtml(time)}</span>` : ''}
    </div>`;
      }

      // ---------------- lightbox ----------------
      const lightbox = $('lightbox'), lightboxImg = $('lightboxImg');
      function openLightbox(url) {
        lightboxImg.src = url;
        lightbox.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function closeLightbox() {
        lightbox.classList.remove('open');
        document.body.style.overflow = '';
      }
      if (lightbox) {
        $('lightboxClose').addEventListener('click', closeLightbox);
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
        document.addEventListener('click', (e) => {
          const thumb = e.target.closest('.scan-thumb');
          if (thumb) openLightbox(thumb.dataset.url);
        });
      }

      function allAuthorNames() {
        return [...new Set(allReports.map(r => r.author && r.author.trim() ? r.author.trim() : '—'))].sort((a, b) => a.localeCompare(b, 'ru'));
      }

      function buildAuthorFilter() {
        const sel = $('authorFilter');
        const authors = allAuthorNames();
        sel.innerHTML = '<option value="">Все авторы</option>' + authors.map(a => `<option value="${escapeAttr(a)}">${escapeHtml(a)}</option>`).join('');
      }

      // ---------------- dashboard render ----------------
      function getFiltered() {
        const q = $('searchInput').value.trim().toLowerCase();
        const authorF = $('authorFilter').value;
        let list = allReports.filter(r => {
          if (authorF && r.author !== authorF) return false;
          if (q) {
            const hay = [r.event, r.winner, r.author, r.date].join(' ').toLowerCase();
            if (!hay.includes(q)) return false;
          }
          return true;
        });
        const sortDir = $('sortSelect').value;
        list.sort((a, b) => {
          const ka = a.created_at || (a.date + ' ' + a.time);
          const kb = b.created_at || (b.date + ' ' + b.time);
          return sortDir === 'new' ? (ka < kb ? 1 : -1) : (ka < kb ? -1 : 1);
        });
        return list;
      }

      function renderStats() {
        const total = allReports.length;
        const authors = new Set(allReports.map(r => r.author).filter(Boolean)).size;
        const playersAll = new Set();
        let sumPlayers = 0;
        allReports.forEach(r => { r.playersArr.forEach(p => playersAll.add(playerName(p))); sumPlayers += r.playersArr.length; });
        const avgAttendance = total ? (sumPlayers / total) : 0;
        const last = allReports.length ? allReports.reduce((m, r) => (r.created_at || '') > (m || '') ? r.created_at : m, '') : null;

        $('statsBento').innerHTML = `
      <div class="glass stat-card b-3 js-reveal">
        <div class="label">Всего отчётов</div>
        <div class="value" id="statTotal">0</div>
      </div>
      <div class="glass stat-card accent-gold b-3 js-reveal">
        <div class="label">Авторов</div>
        <div class="value" id="statAuthors">0</div>
      </div>
      <div class="glass stat-card accent-teal b-3 js-reveal">
        <div class="label">Уник. участников</div>
        <div class="value" id="statPlayers">0</div>
      </div>
      <div class="glass stat-card b-3 js-reveal">
        <div class="label">Ср. посещаемость</div>
        <div class="value" style="font-size:clamp(22px,3vw,32px);"><span id="statAvg">0</span><span class="unit">чел</span></div>
      </div>
      <div class="glass stat-card stat-wide b-12 js-reveal">
        <div class="label" style="margin-bottom:0;">Последний отчёт</div>
        <div class="value mono-small">${last ? escapeHtml(last) : '—'}</div>
      </div>`;

        countUp($('statTotal'), total, { delay: 0 });
        countUp($('statAuthors'), authors, { delay: .06 });
        countUp($('statPlayers'), playersAll.size, { delay: .12 });
        countUp($('statAvg'), avgAttendance, { decimals: 1, delay: .18 });
      }

      const cv = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
      function chartTheme() {
        return { color: cv('--ink-3'), grid: cv('--chart-grid'), font: { family: 'IBM Plex Sans', size: 11 } };
      }

      function gradientFill(ctx, chartArea, colorTop, colorBottom) {
        if (!chartArea) return colorTop;
        const g = ctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
        g.addColorStop(0, colorTop);
        g.addColorStop(1, colorBottom);
        return g;
      }

      const glowPlugin = {
        id: 'softGlow',
        beforeDatasetsDraw(chart, args, opts) {
          chart.ctx.save();
          chart.ctx.shadowColor = opts.color || 'rgba(200,56,31,.35)';
          chart.ctx.shadowBlur = opts.blur || 10;
        },
        afterDatasetsDraw(chart) { chart.ctx.restore(); }
      };
      if (typeof Chart !== 'undefined') { Chart.register(glowPlugin); Chart.defaults.font.family = 'IBM Plex Sans'; }

      function baseTooltip() {
        return {
          backgroundColor: cv('--ink'), borderColor: cv('--ink'), borderWidth: 1,
          titleColor: cv('--paper-2'), bodyColor: cv('--paper-3'), padding: 10, cornerRadius: 0,
          titleFont: { family: 'IBM Plex Sans', weight: '600', size: 12 }, bodyFont: { family: 'IBM Plex Mono', size: 11.5 },
          displayColors: false,
        };
      }

      function renderCharts() {
        if (typeof Chart === 'undefined') {
          ['chartTime', 'chartAuthors', 'chartPlayers'].forEach(id => {
            const c = $(id);
            if (c && c.parentElement) {
              c.parentElement.innerHTML = '<div class="empty-hint" style="padding:30px 0; text-align:center;">Графики недоступны: не удалось загрузить Chart.js.</div>';
            }
          });
          return;
        }
        const theme = chartTheme();
        const byDate = aggregateByDate(allReports);
        const byAuthor = aggregateByAuthor(allReports);
        const byPlayer = aggregatePlayers(allReports);

        if (charts.time) charts.time.destroy();
        charts.time = new Chart($('chartTime'), {
          type: 'line',
          data: {
            labels: byDate.map(d => d[0]),
            datasets: [{
              label: 'Отчётов', data: byDate.map(d => d[1]),
              borderColor: '#c8381f',
              backgroundColor: (ctx) => gradientFill(ctx.chart.ctx, ctx.chart.chartArea, 'rgba(200,56,31,0.32)', 'rgba(200,56,31,0.0)'),
              fill: true, tension: 0.42, pointRadius: 0, pointHoverRadius: 5,
              pointBackgroundColor: '#e0553a', pointHoverBackgroundColor: '#e0553a',
              borderWidth: 2.5, cubicInterpolationMode: 'monotone',
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 900, easing: 'easeOutQuart' },
            interaction: { intersect: false, mode: 'index' },
            plugins: { legend: { display: false }, tooltip: baseTooltip(), softGlow: { color: 'rgba(200,56,31,.35)', blur: 14 } },
            scales: {
              x: { ticks: { color: theme.color, font: theme.font, maxRotation: 0, autoSkip: true, maxTicksLimit: 8 }, grid: { display: false }, border: { color: cv('--ink') } },
              y: { beginAtZero: true, ticks: { color: theme.color, font: theme.font, precision: 0 }, grid: { color: theme.grid }, border: { display: false } }
            }
          }
        });

        if (charts.authors) charts.authors.destroy();
        charts.authors = new Chart($('chartAuthors'), {
          type: 'line',
          data: {
            labels: byAuthor.map(a => a[0]),
            datasets: [{
              label: 'Отчётов', data: byAuthor.map(a => a[1]),
              borderColor: '#1f5a46',
              backgroundColor: (ctx) => gradientFill(ctx.chart.ctx, ctx.chart.chartArea, 'rgba(31,90,70,0.32)', 'rgba(31,90,70,0.0)'),
              fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 7,
              pointBackgroundColor: '#2f7d63', pointHoverBackgroundColor: '#2f7d63',
              borderWidth: 2.5, cubicInterpolationMode: 'monotone',
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 900, easing: 'easeOutQuart' },
            interaction: { intersect: false, mode: 'index' },
            plugins: { legend: { display: false }, tooltip: baseTooltip(), softGlow: { color: 'rgba(31,90,70,.35)', blur: 14 } },
            scales: {
              x: { ticks: { display: false }, grid: { display: false }, border: { color: cv('--ink') } },
              y: { beginAtZero: true, ticks: { color: theme.color, font: theme.font, precision: 0 }, grid: { color: theme.grid }, border: { display: false } }
            }
          }
        });

        if (charts.players) charts.players.destroy();
        charts.players = new Chart($('chartPlayers'), {
          type: 'line',
          data: {
            labels: byPlayer.map(p => p[0]),
            datasets: [{
              label: 'Явок', data: byPlayer.map(p => p[1]),
              borderColor: '#c8381f',
              backgroundColor: (ctx) => gradientFill(ctx.chart.ctx, ctx.chart.chartArea, 'rgba(200,56,31,0.32)', 'rgba(200,56,31,0.0)'),
              fill: true, tension: 0.4, pointRadius: 4, pointHoverRadius: 7,
              pointBackgroundColor: '#e0553a', pointHoverBackgroundColor: '#e0553a',
              borderWidth: 2.5, cubicInterpolationMode: 'monotone',
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 900, easing: 'easeOutQuart' },
            interaction: { intersect: false, mode: 'index' },
            plugins: { legend: { display: false }, tooltip: baseTooltip(), softGlow: { color: 'rgba(200,56,31,.35)', blur: 14 } },
            scales: {
              x: { ticks: { display: false }, grid: { display: false }, border: { display: false } },
              y: { beginAtZero: true, ticks: { color: theme.color, font: theme.font, precision: 0 }, grid: { color: theme.grid }, border: { display: false } }
            }
          }
        });
      }

      function renderReportsTable(fullList, tbodyEl, emptyEl) {
        emptyEl.style.display = fullList.length ? 'none' : 'block';

        const totalPages = Math.max(1, Math.ceil(fullList.length / PAGE_SIZE));
        if (currentPage > totalPages) currentPage = totalPages;
        if (currentPage < 1) currentPage = 1;
        const startIdx = (currentPage - 1) * PAGE_SIZE;
        const list = fullList.slice(startIdx, startIdx + PAGE_SIZE);

        const paginationEl = $('pagination');
        if (paginationEl) {
          if (fullList.length > PAGE_SIZE) {
            paginationEl.style.display = 'flex';
            $('pageInfo').textContent = `Стр. ${currentPage} / ${totalPages} · ${fullList.length} отчётов`;
            $('pagePrev').disabled = currentPage <= 1;
            $('pageNext').disabled = currentPage >= totalPages;
          } else {
            paginationEl.style.display = 'none';
          }
        }

        tbodyEl.innerHTML = list.map((r, i) => {
          const when = (r.date || '') + (r.time ? ' ' + r.time : '');
          return `
      <tr data-idx="${i}" class="report-row">
        <td class="mono">${escapeHtml(when || r.created_at || '—')}</td>
        <td>${escapeHtml(r.event || '—')}</td>
        <td class="badge-winner">${escapeHtml(r.winner || '—')}</td>
        <td><span class="author-chip" data-author="${escapeAttr(r.author || '—')}">${escapeHtml(r.author || '—')}</span></td>
        <td class="players-count">${r.playersArr.length} чел.</td>
      </tr>
      <tr class="detail-row" data-detail="${i}" style="display:none;">
        <td colspan="5">
          <div class="detail-inner">
            <div class="detail-col">
              <h4>Участники (${r.playersArr.length})</h4>
              ${r.playersArr.length ? `<div class="tag-list">${r.playersArr.map(p => `<span class="tag">${escapeHtml(playerName(p))}</span>`).join('')}</div>` : '<div class="empty-hint">нет данных</div>'}
            </div>
            <div class="detail-col">
              <h4>Сканы (${r.scansArr.length})</h4>
              ${r.scansArr.length ? `<div class="scan-grid">${r.scansArr.map(s => renderScanThumb(s)).join('')}</div>` : '<div class="empty-hint">нет данных</div>'}
            </div>
          </div>
        </td>
      </tr>`;
        }).join('');

        tbodyEl.querySelectorAll('.report-row').forEach(row => {
          row.addEventListener('click', (e) => {
            if (e.target.closest('.author-chip')) return;
            const idx = row.getAttribute('data-idx');
            const detail = tbodyEl.querySelector(`[data-detail="${idx}"]`);
            const isOpen = detail.style.display !== 'none';
            if (!isOpen) {
              detail.style.display = 'table-row';
              if (hasGsap && !reduceMotion) {
                gsap.fromTo(detail.querySelector('.detail-inner'), { opacity: 0, y: -6 }, { opacity: 1, y: 0, duration: .35, ease: 'power2.out' });
              }
            } else {
              detail.style.display = 'none';
            }
            row.classList.toggle('expanded', !isOpen);
          });
        });
        tbodyEl.querySelectorAll('.author-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            location.href = 'author.html#/author/' + encodeURIComponent(chip.dataset.author);
          });
        });

        revealStagger(tbodyEl.querySelectorAll('.report-row'), { duration: .45, stagger: .025, y: 12 });
      }

      function renderDashboard() {
        renderStats();
        renderCharts();
        renderReportsTable(getFiltered(), $('tableBody'), $('emptyState'));
        revealStagger('.js-reveal', { stagger: .07 });
      }

      $('searchInput').addEventListener('input', () => { currentPage = 1; renderReportsTable(getFiltered(), $('tableBody'), $('emptyState')); });
      $('authorFilter').addEventListener('change', () => { currentPage = 1; renderReportsTable(getFiltered(), $('tableBody'), $('emptyState')); });
      $('sortSelect').addEventListener('change', () => { currentPage = 1; renderReportsTable(getFiltered(), $('tableBody'), $('emptyState')); });
      $('pagePrev').addEventListener('click', () => { currentPage -= 1; renderReportsTable(getFiltered(), $('tableBody'), $('emptyState')); });
      $('pageNext').addEventListener('click', () => { currentPage += 1; renderReportsTable(getFiltered(), $('tableBody'), $('emptyState')); });

      window.addEventListener('themechange', () => { if (allReports.length) renderCharts(); });

      // ---------------- init ----------------
      connectAndLoad();
    })();
  </script>

  <script>
(function(){
  var root=document.documentElement,mq=window.matchMedia('(prefers-color-scheme: dark)');
  var SUN='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>';
  var MOON='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M16.5 11.5A7 7 0 018.5 3.5a7 7 0 108 8z"/></svg>';
  function eff(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light');}
  var b=document.createElement('button');b.type='button';b.className='theme-toggle';
  function paint(){var d=eff()==='dark';b.innerHTML=d?SUN:MOON;var l=d?'Включить светлую тему':'Включить тёмную тему';b.title=l;b.setAttribute('aria-label',l);}
  function changed(){paint();window.dispatchEvent(new Event('themechange'));}
  b.addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}changed();});
  (mq.addEventListener?mq.addEventListener('change',function(){if(!root.getAttribute('data-theme'))changed();}):0);
  paint();root.appendChild(b);
})();
</script>
</body>

</html>
