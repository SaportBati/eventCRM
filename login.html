<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · Arizona Event CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-card { width: 100%; max-width: 520px; }
    .login-card h1 { margin-bottom: 12px; }
    .login-card p { margin-bottom: 20px; }
    .login-error { display: none; border-left: 4px solid var(--red); background: var(--paper-3); padding: 10px 14px; margin-bottom: 20px; font-size: 13px; line-height: 1.6; color: var(--ink); }
    .login-error.show { display: block; }
    .login-state { display: none; font-family: var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-2); text-align: center; padding: 30px 0 10px; }
    .login-state .spinner { margin-bottom: 14px; }
    button.btn.discord { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #5865f2; border-color: #4752c4; color: #fff; }
    button.btn.discord:hover { background: var(--ink); border-color: var(--ink); }
    .login-or { display: flex; align-items: center; gap: 12px; margin: 22px 0; font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-3); }
    .login-or::before, .login-or::after { content: ''; flex: 1; height: 1px; background: var(--hair); }
    .login-or + .auth-note { margin-top: 0; }
  </style>
  <script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
</head>

<body>
  <div class="auth-wrap">
    <div class="auth-card login-card">
      <svg class="auth-ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="square"><rect x="3.5" y="7" width="9" height="6.5"/><path d="M5.5 7V5a2.5 2.5 0 015 0v2"/></svg>
      <h1>Вход в Arizona Event CRM</h1>

      <div class="login-state" id="stateBox"><div class="spinner"></div><span id="stateText">Проверяем вход…</span></div>

      <div id="loginForm">
        <p>Войдите через Discord, который привязан к вашему игровому аккаунту.</p>
        <div class="login-error" id="loginError" role="alert"></div>
        <button type="button" class="btn primary big discord" id="btnDiscord">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.3 4.4A19.8 19.8 0 0015.4 3l-.2.4a18.3 18.3 0 014.3 1.6 15 15 0 00-14.9 0A18.3 18.3 0 018.9 3.4L8.7 3a19.8 19.8 0 00-4.9 1.4C.7 9 0 13.5.3 17.9a19.9 19.9 0 006 3l.5-.8a13 13 0 01-2-1l.5-.4a14.2 14.2 0 0012.2 0l.5.4a13 13 0 01-2 1l.5.8a19.9 19.9 0 006-3c.4-5.2-.7-9.7-3.2-13.5zM8.5 15.2c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm7 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>
          Войти через Discord
        </button>

        <div class="login-or">или</div>

        <div class="auth-note"><strong>Через игру</strong>Введите команду <code>/esr</code> в игре — браузер откроется уже авторизованным.</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var WORKER_URL = "https://bitter-breeze-2c7b.vitadensikloh.workers.dev";
      var PAGES = ['index.html', 'author.html', 'plan.html', 'report.html'];
      var $ = function (id) { return document.getElementById(id); };

      var ERRORS = {
        not_linked: 'Этот Discord не привязан ни к одному игровому аккаунту. Привяжите Discord через скрипт в игре, затем войдите снова.',
        denied: 'Вход через Discord отменён.',
        bad_token: 'Ссылка входа недействительна или устарела. Введите /esr в игре ещё раз или войдите через Discord.',
        not_allowed: 'Доступ для этого аккаунта запрещён. Обратитесь к администратору.',
        network: 'Не удалось связаться с сервером. Проверьте соединение и попробуйте ещё раз.'
      };

      function showError(key) {
        var el = $('loginError');
        el.textContent = ERRORS[key] || ERRORS.network;
        el.classList.add('show');
      }
      function setLoading(on, text) {
        $('stateBox').style.display = on ? 'block' : 'none';
        $('loginForm').style.display = on ? 'none' : 'block';
        if (text) $('stateText').textContent = text;
      }

      // Страница, на которую вернём после входа (только из белого списка).
      function nextPage() {
        var q = new URLSearchParams(location.search).get('next');
        if (q && PAGES.indexOf(q) !== -1) {
          try { sessionStorage.setItem('login_next', q); } catch (e) { }
          return q;
        }
        try {
          var s = sessionStorage.getItem('login_next');
          if (s && PAGES.indexOf(s) !== -1) return s;
        } catch (e) { }
        return 'index.html';
      }
      function goNext() {
        var page = nextPage();
        try { sessionStorage.removeItem('login_next'); } catch (e) { }
        location.replace(page);
      }

      function hashParam(name) {
        var m = location.hash.match(new RegExp('&' + name + '=([^&/#]+)'));
        return m ? decodeURIComponent(m[1]) : null;
      }

      async function exchangeToken(token) {
        var r = await fetch(WORKER_URL + '/check-token', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token })
        });
        if (!r.ok) return null;
        var d = await r.json();
        return (d && d.ok && d.hwid) ? d.hwid : null;
      }
      async function hwidAllowed(hwid) {
        var r = await fetch(WORKER_URL + '/check-hwid', { headers: { 'X-HWID': hwid } });
        if (!r.ok) return false;
        var d = await r.json();
        return Boolean(d && d.ok && d.allowed);
      }

      $('btnDiscord').addEventListener('click', function () {
        nextPage(); // запоминаем, куда вернуться после Discord
        location.href = WORKER_URL + '/discord-auth';
      });

      (async function init() {
        nextPage();
        var token = hashParam('token');
        var err = hashParam('error');
        if (token || err) history.replaceState(null, '', location.pathname + location.search);

        // 1. Вернулись из /esr или из Discord с одноразовым токеном
        if (token) {
          setLoading(true, 'Выполняем вход…');
          try {
            var hwid = await exchangeToken(token);
            if (!hwid) { setLoading(false); showError('bad_token'); return; }
            if (!(await hwidAllowed(hwid))) { setLoading(false); showError('not_allowed'); return; }
            localStorage.setItem('authorized_hwid', hwid);
            goNext();
          } catch (e) { setLoading(false); showError('network'); }
          return;
        }

        // 2. Discord вернул ошибку
        if (err) { showError(err); return; }

        // 3. Уже авторизованы раньше
        var saved = null;
        try { saved = localStorage.getItem('authorized_hwid'); } catch (e) { }
        if (saved) {
          setLoading(true, 'Проверяем вход…');
          try {
            if (await hwidAllowed(saved)) { goNext(); return; }
            localStorage.removeItem('authorized_hwid');
          } catch (e) { showError('network'); }
          setLoading(false);
        }
      })();
    })();
  </script>
<script>
(function(){
  var root=document.documentElement,mq=window.matchMedia('(prefers-color-scheme: dark)');
  var SUN='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><circle cx="10" cy="10" r="3.5"/><path d="M10 2v2.5M10 15.5V18M2 10h2.5M15.5 10H18M4.3 4.3l1.8 1.8M13.9 13.9l1.8 1.8M4.3 15.7l1.8-1.8M13.9 6.1l1.8-1.8"/></svg>';
  var MOON='<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="square"><path d="M16.5 11.5A7 7 0 018.5 3.5a7 7 0 108 8z"/></svg>';
  function eff(){return root.getAttribute('data-theme')||(mq.matches?'dark':'light');}
  var b=document.createElement('button');b.type='button';b.className='theme-toggle';
  function paint(){var d=eff()==='dark';b.innerHTML=d?SUN:MOON;var l=d?'Включить светлую тему':'Включить тёмную тему';b.title=l;b.setAttribute('aria-label',l);}
  b.addEventListener('click',function(){var n=eff()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}paint();});
  (mq.addEventListener?mq.addEventListener('change',function(){if(!root.getAttribute('data-theme'))paint();}):0);
  paint();root.appendChild(b);
})();
</script>
</body>

</html>
